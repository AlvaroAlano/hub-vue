<div id="hub-lock" hidden>

<script>
(() => {
  const LOCK = {"v":1,"iterations":600000,"salt":"Y29udmNhcmQtaHViL2xvY2svdjE=","check":"convcard-hub-ok","verifier":"3nGoij4xD3DAP2+ykB0oQJJjneNss6jD1op8tBnE+riKlpADZ8mWN4e11Q==","entry":"assets/index-01vRd5oW.js.enc"};
  const BASE = "/hub-vue/";
  const STORAGE = 'hub_lock_key';
  const el = document.getElementById('hub-lock');
  const form = el.querySelector('form');
  const login = el.querySelector('#hub-lock-login');
  const senha = el.querySelector('#hub-lock-senha');
  const lembrar = el.querySelector('#hub-lock-lembrar');
  const erro = el.querySelector('#hub-lock-erro');
  const botao = el.querySelector('button[type=submit]');
  const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const decrypt = (key, bytes) => crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(0, 12) }, key, bytes.slice(12));

  const showError = (msg) => { erro.textContent = msg; erro.hidden = false; };
  const showLock = () => { el.hidden = false; (login.value ? senha : login).focus(); };

  if (!window.crypto || !crypto.subtle) {
    showLock();
    showError('Este navegador não suporta o acesso seguro. Abra o hub pelo endereço https.');
    botao.disabled = true;
    return;
  }

  async function deriveKey(user, pass) {
    const material = new TextEncoder().encode(user.trim().toLowerCase() + '\n' + pass);
    const base = await crypto.subtle.importKey('raw', material, 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', hash: 'SHA-256', salt: fromB64(LOCK.salt), iterations: LOCK.iterations },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']
    );
  }

  async function isValid(key) {
    try { return new TextDecoder().decode(await decrypt(key, fromB64(LOCK.verifier))) === LOCK.check; }
    catch { return false; }
  }

  async function openHub(key) {
    window.__hubKey = key;
    const res = await fetch(BASE + LOCK.entry);
    if (!res.ok) throw new Error('Não foi possível carregar o hub (erro ' + res.status + ').');
    const code = await decrypt(key, new Uint8Array(await res.arrayBuffer()));
    const url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
    await import(url);
    el.remove();
  }

  async function rememberedKey() {
    const raw = localStorage.getItem(STORAGE) || sessionStorage.getItem(STORAGE);
    if (!raw) return null;
    try {
      const key = await crypto.subtle.importKey('raw', fromB64(raw), 'AES-GCM', true, ['decrypt']);
      if (await isValid(key)) return key;
    } catch {}
    localStorage.removeItem(STORAGE);
    sessionStorage.removeItem(STORAGE);
    return null;
  }

  // Permite sair (ex.: computador compartilhado): window.__hubLogout()
  window.__hubLogout = () => {
    localStorage.removeItem(STORAGE);
    sessionStorage.removeItem(STORAGE);
    location.reload();
  };

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    erro.hidden = true;
    botao.disabled = true;
    botao.textContent = 'Verificando...';
    try {
      const key = await deriveKey(login.value, senha.value);
      if (!(await isValid(key))) {
        showError('Login ou senha incorretos.');
        senha.select();
        return;
      }
      const raw = toB64(await crypto.subtle.exportKey('raw', key));
      (lembrar.checked ? localStorage : sessionStorage).setItem(STORAGE, raw);
      senha.value = '';
      await openHub(key);
    } catch (err) {
      showError(err && err.message ? err.message : 'Erro ao abrir o hub.');
    } finally {
      botao.disabled = false;
      botao.textContent = 'Entrar';
    }
  });

  rememberedKey()
    .then((key) => (key ? openHub(key) : showLock()))
    .catch((err) => { showLock(); showError(err && err.message ? err.message : 'Erro ao abrir o hub.'); });
})();
</script>
